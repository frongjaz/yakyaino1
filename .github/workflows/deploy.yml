name: Deploy to checkkub.com (Production)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into server and run deploy script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: checkkub.com
          username: cazfrongz
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            bash /domains/checkkub.com/public_html/deploy-server.sh
