name: Deploy Next.js App to HostAtom (Production)

on:
  push:
    branches:
      - main
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Temporarily move API routes (to allow static build)
        run: |
          if [ -d "app/api" ]; then
            mv app/api .api_backup
          fi

      - name: Build project
        run: npm run build:root
        env:
          NODE_ENV: production
          IS_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_API_URL: https://yakyai-api.vercel.app

      - name: Restore API routes
        if: always()
        run: |
          if [ -d ".api_backup" ]; then
            mv .api_backup app/api
          fi

      - name: Verify build output
        run: |
          echo "File count in out/: $(find out/ -type f | wc -l)"
          ls out/ | head -20

      - name: Check FTP secrets are configured
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_USER" ]; then
            echo "ERROR: Secret FTP_USERNAME is not set in GitHub repo settings."
            exit 1
          fi
          if [ -z "$FTP_PASS" ]; then
            echo "ERROR: Secret FTP_PASSWORD is not set in GitHub repo settings."
            exit 1
          fi
          echo "FTP credentials found (user: $FTP_USER)"

      - name: Deploy to HostAtom via FTP
        env:
          FTP_SERVER: ftp.checkkub.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Write .netrc safely (line by line, avoids issues with special chars in password)
          touch ~/.netrc
          chmod 600 ~/.netrc
          echo "machine $FTP_SERVER" > ~/.netrc
          echo "login $FTP_USER" >> ~/.netrc
          echo "password $FTP_PASS" >> ~/.netrc

          # Verify .netrc structure (password line masked, username masked by GitHub Actions)
          echo "=== .netrc structure check ==="
          awk 'NR==1{print "Line 1:", $1, "<server>"} NR==2{print "Line 2:", $1, "<user>"} NR==3{print "Line 3:", $1, "<pass>"}' ~/.netrc
          echo "Total lines: $(wc -l < ~/.netrc)"
          echo "=============================="

          # lftp reads credentials from .netrc automatically (no inline credentials = no parser issues)
          lftp -d <<LFTP_EOF
          set ftp:passive-mode true;
          set ftp:use-feat false;
          set ssl:verify-certificate false;
          set net:timeout 120;
          set net:max-retries 5;
          set net:reconnect-interval-base 5;
          open ftp://$FTP_SERVER;
          mirror --reverse --delete --parallel=5 --verbose \
            --exclude-glob .git \
            --exclude-glob .DS_Store \
            --exclude-glob node_modules/ \
            --exclude-glob .env.local \
            --exclude-glob restart-pm2.php \
            --exclude-glob ecosystem.config.js \
            --exclude-glob server.js \
            out/ domains/checkkub.com/public_html/;
          bye;
          LFTP_EOF

          rm -f ~/.netrc
