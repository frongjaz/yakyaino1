name: Deploy Next.js App to HostAtom (Production)

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Temporarily move API routes (to allow static build)
        run: |
          if [ -d "app/api" ]; then
            mv app/api .api_backup
            echo "✅ API routes moved to .api_backup"
          fi

      - name: Build project
        run: npm run build:root
        env:
          NODE_ENV: production
          IS_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_API_URL: https://yakyai-api.vercel.app

      - name: Restore API routes
        run: |
          if [ -d ".api_backup" ]; then
            mv .api_backup app/api
            echo "✅ API routes restored"
          fi

      - name: Deploy to HostAtom via FTP
        env:
          FTP_SERVER: ftp.checkkub.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:passive-mode true;
            set ftp:use-feat false;
            set ssl:verify-certificate false;
            set net:timeout 120;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            set mirror:parallel-transfer-count 5;
            open -u \"$FTP_USER\",\"$FTP_PASS\" ftp://$FTP_SERVER;
            mirror --reverse --delete --parallel=5 --verbose \
              --exclude '.git' \
              --exclude '.DS_Store' \
              --exclude 'node_modules/' \
              --exclude '.env.local' \
              --exclude 'restart-pm2.php' \
              --exclude 'ecosystem.config.js' \
              --exclude 'server.js' \
              out/ domains/checkkub.com/public_html/;
            bye;
          "
