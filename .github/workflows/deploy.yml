name: Deploy Next.js App to HostAtom (Production)

on:
  push:
    branches:
      - main
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Temporarily move API routes (to allow static build)
        run: |
          if [ -d "app/api" ]; then
            mv app/api .api_backup
            echo "API routes moved to .api_backup"
          fi

      - name: Build project
        run: npm run build:root
        env:
          NODE_ENV: production
          IS_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_API_URL: https://yakyai-api.vercel.app

      - name: Restore API routes
        if: always()
        run: |
          if [ -d ".api_backup" ]; then
            mv .api_backup app/api
            echo "API routes restored"
          fi

      - name: Verify build output
        run: |
          echo "=== out/ directory contents ==="
          ls -la out/ || echo "ERROR: out/ directory not found!"
          echo "=== File count ==="
          find out/ -type f | wc -l

      - name: Deploy to HostAtom via FTP
        env:
          FTP_SERVER: ftp.checkkub.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          printf 'machine %s\nlogin %s\npassword %s\n' "$FTP_SERVER" "$FTP_USER" "$FTP_PASS" > ~/.netrc
          chmod 600 ~/.netrc

          lftp -d -c "
            set ftp:passive-mode true;
            set ftp:use-feat false;
            set ssl:verify-certificate false;
            set net:timeout 120;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            open ftp://$FTP_SERVER;
            mirror --reverse --delete --parallel=5 --verbose \
              --exclude-glob .git \
              --exclude-glob .DS_Store \
              --exclude-glob node_modules/ \
              --exclude-glob .env.local \
              --exclude-glob restart-pm2.php \
              --exclude-glob ecosystem.config.js \
              --exclude-glob server.js \
              out/ domains/checkkub.com/public_html/;
            bye;
          "

          rm -f ~/.netrc
