name: Deploy Next.js Static to HostAtom (FTP)

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Temporarily move API routes
        run: |
          if [ -d "app/api" ]; then
            mv app/api .api_backup
            echo "✅ API routes moved to .api_backup"
          fi

      - name: Build project
        run: npm run build:root
        env:
          NEXT_PUBLIC_API_URL: ''

      - name: Restore API routes
        run: |
          if [ -d ".api_backup" ]; then
            mv .api_backup app/api
            echo "✅ API routes restored"
          fi

      - name: Deploy to HostAtom via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.checkkub.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: out/
          server-dir: domains/checkkub.com/public_html/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            ecosystem.config.js
            server.js
            restart-pm2.php
            .env.local
