name: Deploy Next.js Static to HostAtom (FTP)

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - run: npm ci

      - name: Temporarily move API routes and dynamic pages
        run: |
          # Move API routes
          if [ -d "app/api" ]; then
            mv app/api .api_backup
            echo "API routes moved to .api_backup"
          fi
          # Move only admin/dashboard (server-side), keep admin/login (client-side)
          if [ -d "app/admin/dashboard" ]; then
            mkdir -p .admin_backup
            mv app/admin/dashboard .admin_backup/dashboard
            echo "Admin dashboard moved to .admin_backup"
          fi
          # Move test-db page (require server-side)
          if [ -d "app/test-db" ]; then
            mv app/test-db .test_db_backup
            echo "Test DB page moved to .test_db_backup"
          fi

      - name: Build project
        run: npm run build:root

      - name: Restore moved files
        run: |
          if [ -d ".api_backup" ]; then
            mv .api_backup app/api
            echo "API routes restored"
          fi
          if [ -d ".admin_backup" ]; then
            mkdir -p app/admin
            mv .admin_backup/dashboard app/admin/dashboard
            rmdir .admin_backup
            echo "Admin dashboard restored"
          fi
          if [ -d ".test_db_backup" ]; then
            mv .test_db_backup app/test-db
            echo "Test DB page restored"
          fi

      - name: Verify build output
        run: |
          echo "Checking dist folder contents:"
          ls -la dist/ || true
          echo "Checking for index.html:"
          ls -la dist/index.html || echo "index.html not found!"
          echo "Checking for admin/login:"
          ls -la dist/admin/login/ || echo "admin/login not found!"
          echo "Checking dist structure:"
          find dist -name "*.html" | head -20

      - name: Copy .htaccess to dist
        run: |
          if [ -f public/.htaccess ]; then
            cp public/.htaccess dist/.htaccess
            echo ".htaccess copied successfully"
          else
            echo "Warning: public/.htaccess not found"
          fi

      - name: Deploy to HostAtom via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.checkkub.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: domains/checkkub.com/public_html/
