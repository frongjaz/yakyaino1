name: Deploy Next.js Static to HostAtom (FTP)

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (Static Export)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""

      - name: Deploy to HostAtom via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ftp.checkkub.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: out/
          server-dir: /domains/checkkub.com/public_html/
