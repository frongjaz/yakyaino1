name: Deploy Next.js App to HostAtom (Production)

on:
  push:
    branches:
      - main
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Temporarily move API routes (to allow static build)
        run: |
          if [ -d "app/api" ]; then
            mv app/api .api_backup
          fi

      - name: Build project
        run: npm run build:root
        env:
          NODE_ENV: production
          IS_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_API_URL: https://yakyaino1.vercel.app

      - name: Restore API routes
        if: always()
        run: |
          if [ -d ".api_backup" ]; then
            mv .api_backup app/api
          fi

      - name: Verify build output
        run: |
          echo "File count in out/: $(find out/ -type f | wc -l)"
          ls out/ | head -20

      - name: Deploy to HostAtom via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.checkkub.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./out/
          server-dir: domains/checkkub.com/public_html/
          timeout: 300000
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            .env.local
            restart-pm2.php
            ecosystem.config.js
            server.js
