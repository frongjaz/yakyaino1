name: Deploy Next.js Dynamic to HostAtom (FTP)

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build:root
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.VERCEL_API_URL || 'https://checkkub.com' }}

      - name: Prepare deployment directory
        run: |
          mkdir -p dist
          # Copy essential files for production
          cp -r .next dist/
          cp -r public dist/
          cp -r scripts dist/
          cp package.json dist/
          cp server.js dist/
          cp ecosystem.config.js dist/
          cp restart-pm2.php dist/
          
          # Copy .htaccess for production
          if [ -f .htaccess.production ]; then
            cp .htaccess.production dist/.htaccess
          elif [ -f public/.htaccess ]; then
            cp public/.htaccess dist/.htaccess
          fi
          
          echo "✅ Deployment directory 'dist' prepared"

      - name: Deploy to HostAtom via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.checkkub.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: domains/checkkub.com/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store

      - name: Trigger PM2 Restart
        run: |
          echo "🚀 Triggering PM2 restart via HTTP..."
          curl -s https://checkkub.com/restart-pm2.php
          echo "✅ Restart trigger sent"
